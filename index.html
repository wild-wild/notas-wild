<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>📚 Mis Notas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* RESET RÁPIDO */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      margin:0 auto;
      max-width:900px;
      padding:2rem;
      line-height:1.6;
      background: #f5f7fa;
      color: #333;
    }

    h1 {
      color: #0969da;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    p.intro {
      text-align: center;
      color: #555;
      margin-bottom: 2rem;
    }

    ul { list-style:none; padding-left:0; display: grid; gap: 1rem; }

    li {
      background:white;
      padding:1rem 1.5rem;
      border-radius:12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    li:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }

    a {
      color:#0969da;
      text-decoration:none;
      font-weight:700;
      font-size: 1.1rem;
    }

    a:hover {
      text-decoration: underline;
    }

    .meta {
      font-size:.8rem;
      color:#586069;
      margin-top:0.25rem;
    }

    .snippet {
      font-size:.95rem;
      color:#444;
      margin-top:0.5rem;
      line-height:1.4;
    }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      li { padding: 0.75rem 1rem; }
      a { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <h1>📂 Índice de Notas</h1>
  <p class="intro">Lista de archivos .md con preview de contenido. Haz click en el título para abrir.</p>
  <ul id="lista"></ul>

  <script>
    const USER = 'wild-wild';
    const REPO = 'notas-wild';

    async function obtenerMD() {
      const treeRes = await fetch(`https://api.github.com/repos/${USER}/${REPO}/git/trees/main?recursive=1`);
      const treeJson = await treeRes.json();
      const mdFiles = treeJson.tree.filter(f => f.path.endsWith('.md') && f.path !== 'README.md')
                                   .sort((a,b) => a.path.localeCompare(b.path));

      const lista = document.getElementById('lista');

      for (const file of mdFiles) {
        const rawUrl = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${file.path}`;
        const blobUrl = `https://github.com/${USER}/${REPO}/blob/main/${file.path}`;
        const contentRes = await fetch(rawUrl);
        const contentText = await contentRes.text();
        const snippet = contentText.split('\n').slice(0,3).join(' ') + '...';

        const li = document.createElement('li');
        li.innerHTML = `
          <a href="${blobUrl}" target="_blank">${file.path}</a>
          <div class="meta">Última modificación: --</div>
          <div class="snippet">${snippet}</div>
        `;
        lista.appendChild(li);
      }
    }

    obtenerMD();
  </script>
</body>
</html>
