<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>📚 Mis Notas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Tailwind CSS + Typography plugin -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <!-- Marked -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="max-w-5xl mx-auto px-6 py-10">
    <h1 class="text-3xl font-bold text-indigo-600 text-center mb-2">📂 Índice de Notas</h1>
    <p class="text-center text-slate-600 mb-8">Pulsa sobre cualquier nota para leerla sin salir de la página.</p>

    <ul id="lista" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></ul>
  </div>

  <!-- Modal -->
  <div id="mdModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-[90%] max-w-4xl max-h-[85vh] flex flex-col">
      <header class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
        <h2 id="modalTitle" class="text-lg font-semibold text-slate-700"></h2>
        <button onclick="cierraModal()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
      </header>
      <main id="mdContent" class="px-6 py-4 overflow-auto prose prose-indigo max-w-none"></main>
    </div>
  </div>

  <script>
    const USER = 'wild-wild';
    const REPO = 'notas-wild';

    async function obtenerMD() {
      const res  = await fetch(`https://api.github.com/repos/${USER}/${REPO}/git/trees/main?recursive=1`);
      const data = await res.json();
      const files = data.tree
                        .filter(f => f.path.endsWith('.md') && f.path !== 'README.md')
                        .sort((a,b) => a.path.localeCompare(b.path));
      const lista = document.getElementById('lista');
      for (const file of files) {
        const titulo = file.path.replace(/^notas\//,'').replace(/\.md$/,'');
        const rawUrl = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${file.path}`;
        const li = document.createElement('li');
        li.className = 'bg-white rounded-lg shadow hover:shadow-lg transition';
        li.innerHTML = `
          <button onclick="abreModal('${rawUrl}', '${titulo}')" class="w-full text-left p-4">
            <div class="font-semibold text-indigo-600">${titulo}</div>
            <div class="text-sm text-slate-500 mt-1">Click para leer</div>
          </button>`;
        lista.appendChild(li);
      }
    }

    async function abreModal(url, titulo) {
      const res  = await fetch(url);
      const md   = await res.text();
      document.getElementById('modalTitle').textContent   = titulo;
      document.getElementById('mdContent').innerHTML      = marked.parse(md);
      document.getElementById('mdModal').classList.remove('hidden');
      document.getElementById('mdModal').classList.add('flex');
    }

    function cierraModal() {
      document.getElementById('mdModal').classList.add('hidden');
      document.getElementById('mdModal').classList.remove('flex');
    }

    // Cerrar con ESC
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') cierraModal();
    });

    obtenerMD();
  </script>
</body>
</html>
