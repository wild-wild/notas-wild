<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>📚 Mis Notas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- Tailwind + typography plugin -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden">
  <div class="flex h-full">

    <!-- 1. Lista lateral izquierda -->
    <aside class="w-80 bg-white shadow-lg overflow-y-auto">
      <h2 class="text-lg font-bold text-indigo-600 px-4 py-4 border-b">Índice</h2>
      <ul id="lista" class="divide-y divide-slate-200"></ul>
    </aside>

    <!-- 2. Contenido derecha -->
    <main class="flex-1 overflow-y-auto">
      <div id="mdContent" class="prose prose-indigo max-w-none p-8">
        <p class="text-slate-500">Selecciona una nota del lateral para ver su contenido.</p>
      </div>
    </main>

  </div>

  <script>
    const USER = 'wild-wild';
    const REPO = 'notas-wild';

    async function obtenerMD() {
      const res  = await fetch(`https://api.github.com/repos/${USER}/${REPO}/git/trees/main?recursive=1`);
      const data = await res.json();
      const files = data.tree
                        .filter(f => f.path.endsWith('.md') && f.path !== 'README.md')
                        .sort((a,b) => a.path.localeCompare(b.path));
      const lista = document.getElementById('lista');

      for (const file of files) {
        const titulo = file.path.replace(/^notas\//,'').replace(/\.md$/,'');
        const rawUrl = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${file.path}`;
        const li = document.createElement('li');
        li.className = 'px-4 py-3 hover:bg-indigo-50 cursor-pointer';
        li.textContent = titulo;
        li.onclick = () => cargaContenido(rawUrl, titulo);
        lista.appendChild(li);
      }
    }

    async function cargaContenido(url, titulo) {
      const res = await fetch(url);
      const md  = await res.text();
      document.getElementById('mdContent').innerHTML = marked.parse(md);
      // título opcional arriba
      document.title = `📚 ${titulo}`;
    }

    obtenerMD();
  </script>
</body>
</html>
