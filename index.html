<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>📚 Mis Notas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="bg-gradient-to-br from-slate-100 to-white text-gray-800 h-screen overflow-hidden">

  <!-- Barra superior móvil -->
  <header class="md:hidden bg-white shadow py-3 px-4 flex items-center justify-between">
    <h1 class="font-semibold text-indigo-600">📚 Mis Notas</h1>
    <button id="menuBtn" aria-label="Abrir menú" class="text-indigo-600 text-2xl">☰</button>
  </header>

  <div class="flex h-full">

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 md:w-80 w-72 bg-white/90 backdrop-blur-md shadow-lg border-r border-slate-200 transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-20">
      <h2 class="text-xl font-bold text-indigo-600 px-6 py-4 border-b bg-white/70 backdrop-blur-lg">
        📂 Índice
      </h2>
      <ul id="lista" class="divide-y divide-slate-100 overflow-y-auto h-[calc(100%-64px)]"></ul>
    </aside>

    <!-- Contenido principal -->
    <main class="flex-1 overflow-y-auto p-5 md:p-8">
      <div id="mdContent" class="prose prose-indigo max-w-none">
        <p class="text-slate-500">Selecciona una nota del índice lateral para ver su contenido.</p>
      </div>
    </main>
  </div>

  <script>
    // 🔧 Configura aquí tu repositorio
    const USER = 'wild-wild'; // <-- Cambia esto
    const REPO = 'notas-wild'; // <-- Cambia esto
    const BRANCH = 'main'; // o 'master' según tu repo

    const sidebar = document.getElementById('sidebar');
    let sidebarVisible = false;

    // Mostrar/Ocultar sidebar en móvil
    document.getElementById('menuBtn')?.addEventListener('click', () => {
      sidebarVisible = !sidebarVisible;
      sidebar.style.transform = sidebarVisible ? 'translateX(0)' : 'translateX(-100%)';
    });

    // Cargar lista de notas
    async function obtenerMD() {
      try {
        const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/git/trees/${BRANCH}?recursive=1`);
        const data = await res.json();
        const files = data.tree
          .filter(f => f.path.endsWith('.md') && f.path !== 'README.md')
          .sort((a, b) => a.path.localeCompare(b.path));

        const lista = document.getElementById('lista');
        files.forEach(file => {
          const titulo = file.path.replace(/\.md$/, '');
          const rawUrl = `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/${file.path}`;
          const li = document.createElement('li');
          li.className = 'px-4 py-3 hover:bg-indigo-50 cursor-pointer transition-colors';
          li.textContent = titulo;
          li.onclick = () => cargarContenido(rawUrl, titulo);
          lista.appendChild(li);
        });

      } catch (error) {
        console.error('Error al obtener archivos:', error);
      }
    }

    // Cargar contenido de una nota
    async function cargarContenido(url, titulo) {
      try {
        const res = await fetch(url);
        const md = await res.text();
        const contenedor = document.getElementById('mdContent');
        contenedor.innerHTML = marked.parse(md);

        // Añadir botón de copia a los bloques de código
        contenedor.querySelectorAll('pre > code').forEach(block => {
          const pre = block.parentElement;
          const button = document.createElement('button');
          button.textContent = '📋 Copiar';
          button.className = 'absolute top-2 right-2 bg-indigo-600 text-white text-xs px-2 py-1 rounded shadow hover:bg-indigo-700 transition';

          button.onclick = () => {
            navigator.clipboard.writeText(block.textContent);
            button.textContent = '✅ Copiado';
            setTimeout(() => button.textContent = '📋 Copiar', 2000);
          };

          pre.classList.add('relative', 'bg-slate-900', 'text-slate-100', 'p-4', 'rounded-lg', 'overflow-x-auto', 'mb-4');
          pre.appendChild(button);
        });

        document.title = `📚 ${titulo}`;
        if (sidebarVisible) toggleSidebar(); // Cierra sidebar en mobile
      } catch (error) {
        console.error('Error al cargar contenido:', error);
      }
    }

    function toggleSidebar() {
      sidebarVisible = !sidebarVisible;
      sidebar.style.transform = sidebarVisible ? 'translateX(0)' : 'translateX(-100%)';
    }

    obtenerMD();
  </script>

</body>
</html>
